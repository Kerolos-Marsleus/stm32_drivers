; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = led_button_nucleo


[blackpill_base]
platform            = ststm32
board               = blackpill_f401cc
framework           = cmsis
upload_protocol     = stlink
debug_tool          = stlink
debug_init_break    = tbreak main   ; debugger stops at the first line of main()
build_type          = debug         ; -Og -g: every line can be stepped, every variable seen
build_flags         =
    -I src/MCAL/RCC
    -I src/MCAL/GPIO
    -I src/BSP
    -I src/HAL/HLED
    -D BOARD_BLACKPILL_F401


[nucleo_base]
extends             = blackpill_base
board               = nucleo_f411re
build_flags         =
    -I src/MCAL/RCC
    -I src/MCAL/GPIO
    -I src/BSP
    -I src/HAL/HLED
    -D BOARD_NUCLEO_F411

; one environment per app
[env:led_button_blackpill]
extends             = blackpill_base
build_src_filter    = +<MCAL/> +<HAL/> +<APP/led_button/> 

[env:led_button_nucleo]
extends             = nucleo_base
build_src_filter    = +<MCAL/> +<APP/led_button/> +<HAL/>

[env:switch_led_bar_blackpill]
extends             = blackpill_base
build_src_filter    = +<MCAL/> +<HAL/> +<APP/switch_led_bar/> 

[env:binary_counter_blackpill]
extends             = blackpill_base
build_src_filter    = +<MCAL/> +<HAL/> +<APP/binary_counter/> 

[env:sevenseg_counter_blackpill]
extends             = blackpill_base
build_src_filter    = +<MCAL/> +<HAL/> +<APP/sevenseg_counter/>


; unit test on the pc
[env:native]
platform            = native
test_framework      = unity
test_build_src      = yes
build_src_filter    = +<MCAL/RCC/>
build_flags         = -I src/MCAL/RCC


